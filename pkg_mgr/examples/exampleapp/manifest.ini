[Application]
Name=ExampleApp
ID=com.example.exampleapp
Version=1.0.0
Description=An example application for Urados
Type=executable

[Installation]
Prefix=/urados/apps/exampleapp

[Files]
File1.Source=bin/exampleapp
File1.Destination=bin/exampleapp

File2.Source=bin/helper
File2.Destination=bin/helper

File3.Source=scripts/setup.sh
File3.Destination=scripts/setup.sh

File4.Source=data/config.ini
File4.Destination=config/config.ini

File5.Source=data/icon.png
File5.Destination=share/icon.png

[Execution]
Executable=bin/exampleapp
# WorkingDirectory=.
Arguments=
RunAs=root
