# Base-policy declarations required by urados.te.
# SELinux users cannot be declared in a loadable module, so these lines must be
# added to the device base policy (policy/users) before urados.pp is loaded.
user urados_root_u roles { urados_root_r };
user urados_user_u roles { urados_user_r };
user urados_app_u  roles { urados_app_r };
